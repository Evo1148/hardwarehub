version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: hardwarehub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: hardwarehub_db
      MYSQL_USER: hwuser
      MYSQL_PASSWORD: hwpass
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"

  adminer:
    image: adminer
    container_name: hardwarehub-adminer
    depends_on:
      - mysql
    ports:
      - "8081:8080"

volumes:
  db_data:
