version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hardwarehub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hardwarehub
      MYSQL_USER: hardware
      MYSQL_PASSWORD: hardware
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: hardwarehub-adminer
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  mysql_data:
