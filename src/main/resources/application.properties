spring.application.name=hardwarehub

# ==========================
#   MYSQL EN DOCKER
# ==========================

spring.datasource.url=jdbc:mysql://localhost:3307/hardwarehub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=hardware
spring.datasource.password=hardware
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
