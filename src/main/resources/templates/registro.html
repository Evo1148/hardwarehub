<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::contenido})">

<div th:fragment="contenido">

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-dino">
                <div class="card-body">
                    <h1 class="h4 mb-3">Crear cuenta</h1>

                    <form th:action="@{/registro}" th:object="${usuario}" method="post">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input id="nombre" class="form-control" th:field="*{nombre}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error nombre</div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" type="email" class="form-control" th:field="*{email}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error email</div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input id="password" type="password" class="form-control" th:field="*{password}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error contraseña</div>
                        </div>

                        <div class="mb-3">
                            <label for="rol" class="form-label">Tipo de cuenta</label>
                            <select id="rol" class="form-select" th:field="*{rol}">
                                <option th:each="r : ${rolesRegistro}"
                                        th:value="${r}"
                                        th:text="${r == T(com.hardwarehub.hardwarehub.model.Rol).VENDEDOR ? 'Vendedor - quiero publicar productos' : 'Cliente - quiero comprar'}">
                                </option>
                            </select>
                        </div>

                        <button class="btn btn-dino-primary w-100" type="submit">Registrarme</button>
                    </form>

                    <p class="mt-3 mb-0">
                        ¿Ya tienes cuenta?
                        <a th:href="@{/login}">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

</div>

</html>
