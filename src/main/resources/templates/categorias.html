<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::contenido})">

<div th:fragment="contenido">

    <div th:if="${mensaje != null}" class="mb-3">
        <div class="alert alert-warning" th:text="${mensaje}"></div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Categorías</h1>
        <a class="btn btn-primary" th:href="@{/categorias/nueva}">Nueva categoría</a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="categoria : ${categorias}">
            <td th:text="${categoria.id}">1</td>
            <td th:text="${categoria.nombre}">Ejemplo</td>
            <td th:text="${categoria.descripcion}">Descripción</td>
            <td class="text-end">
                <a class="btn btn-sm btn-secondary"
                   th:href="@{'/categorias/editar/' + ${categoria.id}}">Editar</a>
                <form th:action="@{'/categorias/eliminar/' + ${categoria.id}}" method="post" class="d-inline">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-sm btn-danger ms-1"
                            onclick="return confirm('¿Seguro que deseas eliminar esta categoría?');">
                        Eliminar
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(categorias)}" class="alert alert-info">
        No hay categorías todavía. Crea la primera.
    </div>
</div>

</html>
