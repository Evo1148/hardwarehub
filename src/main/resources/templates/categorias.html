<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de categorías</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">HardwareHub</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/tienda}">Tienda</a>
            <a class="nav-link" th:href="@{/carrito}">Carrito</a>
            <a class="nav-link" th:href="@{/productos}">Admin Productos</a>
            <a class="nav-link" th:href="@{/categorias}">Admin Categorías</a>
        </div>
    </div>
</nav>


<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Categorías</h1>
        <a class="btn btn-primary" th:href="@{/categorias/nueva}">Nueva categoría</a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="categoria : ${categorias}">
            <td th:text="${categoria.id}">1</td>
            <td th:text="${categoria.nombre}">Ejemplo</td>
            <td th:text="${categoria.descripcion}">Descripción</td>
            <td class="text-end">
                <a class="btn btn-sm btn-secondary"
                   th:href="@{'/categorias/editar/' + ${categoria.id}}">Editar</a>
                <a class="btn btn-sm btn-danger ms-1"
                   th:href="@{'/categorias/eliminar/' + ${categoria.id}}"
                   onclick="return confirm('¿Seguro que deseas eliminar esta categoría?');">
                    Eliminar
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(categorias)}" class="alert alert-info">
        No hay categorías todavía. Crea la primera.
    </div>
</div>

</body>
</html>
