<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::contenido})">

<div th:fragment="contenido">

    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-dino">
                <div class="card-body">
                    <h1 class="h4 mb-3">Iniciar sesión</h1>

                    <div th:if="${mensaje != null}" class="alert alert-success" th:text="${mensaje}"></div>
                    <div th:if="${error}" class="alert alert-danger">Email o contraseña incorrectos.</div>
                    <div th:if="${logout}" class="alert alert-info">Sesión cerrada correctamente.</div>

                    <form th:action="@{/login}" method="post">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" name="email" type="email" class="form-control" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input id="password" name="password" type="password" class="form-control" required>
                        </div>

                        <button class="btn btn-dino-primary w-100" type="submit">Entrar</button>
                    </form>

                    <hr>

                    <p class="mb-1 text-muted">Usuarios de prueba:</p>
                    <ul class="small text-muted mb-3">
                        <li>Admin: admin@hardwarehub.com / admin123</li>
                        <li>Vendedor: vendedor@hardwarehub.com / vendedor123</li>
                        <li>Cliente: cliente@hardwarehub.com / cliente123</li>
                    </ul>

                    <p class="mb-0">
                        ¿No tienes cuenta?
                        <a th:href="@{/registro}">Regístrate</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

</div>

</html>
