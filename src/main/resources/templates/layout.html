<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
  <meta charset="UTF-8">
  <title th:text="${title} ?: 'HardwareHub'">HardwareHub</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="dino-bg">

<nav class="navbar navbar-expand-lg navbar-dark navbar-dino mb-4">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
      <img th:src="@{/images/logo.png}" alt="HardwareHub Logo"
           style="height:40px; margin-right:10px;">
      <span>HardwareHub</span>
    </a>

    <div class="navbar-nav ms-auto align-items-lg-center">
      <a class="nav-link" th:href="@{/tienda}">Marketplace</a>

      <a class="nav-link" th:if="${isLoggedIn}" th:href="@{/carrito}">
        Carrito
        <span class="ms-1" th:text="${'(' + cartCount + ')'}"></span>
      </a>

      <a class="nav-link" th:if="${isLoggedIn}" th:href="@{/pedidos}">Mis compras</a>
      <a class="nav-link" th:if="${isVendedor or isAdmin}" th:href="@{/productos}">Mis productos</a>
      <a class="nav-link" th:if="${isVendedor or isAdmin}" th:href="@{/vendedor/ventas}">Ventas</a>
      <a class="nav-link" th:if="${isAdmin}" th:href="@{/categorias}">Categorías</a>

      <a class="nav-link" th:if="${!isLoggedIn}" th:href="@{/login}">Iniciar sesión</a>
      <a class="btn btn-sm btn-light ms-lg-2" th:if="${!isLoggedIn}" th:href="@{/registro}">Registrarse</a>

      <span class="navbar-text ms-lg-3" th:if="${isLoggedIn}">
        <span th:text="${currentUser.nombre}">Usuario</span>
        <small th:text="${'(' + currentUser.rol + ')'}"></small>
      </span>

      <form th:if="${isLoggedIn}" th:action="@{/logout}" method="post" class="ms-lg-2 mb-0">
          <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-sm btn-outline-light" type="submit">Salir</button>
      </form>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div th:replace="${content}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
