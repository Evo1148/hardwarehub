<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${title} ?: 'HardwareHub'">HardwareHub</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <link rel="stylesheet" th:href="@{/css/style.css}">


</head>

<body class="dino-bg">

<nav class="navbar navbar-expand-lg navbar-dark navbar-dino mb-4">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
      <img th:src="@{/images/logo.png}" alt="HardwareHub Logo"
           style="height:40px; margin-right:10px;">
      <span>HardwareHub</span>
    </a>

    <div class="navbar-nav ms-auto">
      <a class="nav-link" th:href="@{/tienda}">Tienda</a>
      <a class="nav-link" th:href="@{/carrito}">
        Carrito
        <span class="ms-1" th:text="${'(' + cartCount + ')'}"></span>
      </a>
      <a class="nav-link" th:href="@{/productos}">Admin Productos</a>
      <a class="nav-link" th:href="@{/categorias}">Admin Categorías</a>
    </div>
  </div>
</nav>


<div class="container mt-4">
  <div th:replace="${contenido}"></div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
