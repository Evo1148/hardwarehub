<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tienda - HardwareHub</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Tema Dino -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-dino mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/images/logo.png}"
                 alt="HardwareHub Logo"
                 style="height:40px; margin-right:10px;">
            <span>HardwareHub</span>
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/tienda}">Tienda</a>
            <a class="nav-link" th:href="@{/carrito}">
                Carrito
                <span class="ms-1" th:text="${'(' + cartCount + ')'}"></span>
            </a>
            <a class="nav-link" th:href="@{/productos}">Admin Productos</a>
            <a class="nav-link" th:href="@{/categorias}">Admin Categorías</a>
        </div>
    </div>
</nav>


<div class="container main-container">

    <!-- Cabecera + filtro -->
    <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <h1 class="h3 page-title">Catálogo de Productos</h1>
            <p class="subtitle">Explora nuestro arsenal prehistórico de hardware 🦕</p>
        </div>

        <form class="d-flex gap-2" th:action="@{/tienda}" method="get">
            <input type="text"
                   class="form-control"
                   name="q"
                   placeholder="Buscar por nombre..."
                   th:value="${q}">
            <select class="form-select" name="categoriaId">
                <option value="" th:selected="${categoriaId == null}">
                    Todas las categorías
                </option>
                <option th:each="c : ${categorias}"
                        th:value="${c.id}"
                        th:text="${c.nombre}"
                        th:selected="${categoriaId != null and categoriaId == c.id}">
                </option>
            </select>
            <button type="submit" class="btn btn-dino-primary">Filtrar</button>
        </form>
    </div>

    <!-- No hay productos -->
    <div class="row" th:if="${#lists.isEmpty(productos)}">
        <div class="col-12">
            <div class="alert alert-info">
                No hay productos en la tienda todavía.
            </div>
        </div>
    </div>

    <!-- Grid de productos -->
    <div class="row g-4">
        <div class="col-md-4 col-lg-3" th:each="p : ${productos}">
            <div class="card card-dino h-100">

                <img th:if="${p.imagen != null}"
                     th:src="${p.imagen}"
                     class="card-img-top p-3"
                     style="height: 180px; object-fit: contain;">

                <div class="card-body d-flex flex-column">
                    <span class="badge badge-category mb-2"
                          th:text="${p.categoria != null ? p.categoria.nombre : 'Sin categoría'}">
                        Categoria
                    </span>

                    <h5 class="card-title" th:text="${p.nombre}">Nombre producto</h5>

                    <p class="card-text mt-auto mb-1">
                        <strong>Precio:</strong>
                        <span th:text="${p.precio}"></span> €
                    </p>
                </div>

                <div class="card-footer bg-transparent border-0 d-flex justify-content-between">
                    <a class="btn btn-sm btn-dino-outline"
                       th:href="@{'/tienda/producto/' + ${p.id}}">
                        Ver
                    </a>
                    <a class="btn btn-sm btn-dino-primary"
                       th:href="@{'/carrito/add/' + ${p.id}}">
                        Añadir
                    </a>
                </div>

            </div>
        </div>
    </div>

</div>

</body>
</html>
