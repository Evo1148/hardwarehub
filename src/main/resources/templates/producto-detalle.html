<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${producto.nombre}">Detalle Producto</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/static/styles.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-dino mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <span class="dino-icon">🦖</span>
            <span>HardwareHub</span>
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/tienda}">Tienda</a>
            <a class="nav-link" th:href="@{/carrito}">
                Carrito
                <span class="ms-1" th:text="${'(' + cartCount + ')'}"></span>
            </a>
            <a class="nav-link" th:href="@{/productos}">Admin Productos</a>
            <a class="nav-link" th:href="@{/categorias}">Admin Categorías</a>
        </div>
    </div>
</nav>

<div class="container main-container">

    <div class="row">
        <div class="col-md-5 text-center">
            <img th:src="${producto.imagen}"
                 class="img-fluid mb-4 border"
                 style="max-height: 320px; object-fit: contain;">
        </div>

        <div class="col-md-7">
            <h1 class="h3 page-title" th:text="${producto.nombre}">Nombre</h1>

            <p class="subtitle mb-2">
                <strong>Categoría:</strong>
                <span th:text="${producto.categoria != null ? producto.categoria.nombre : 'Sin categoría'}"></span>
            </p>

            <h3 class="text-success mb-3">
                <span th:text="${producto.precio}"></span> €
            </h3>

            <p th:text="${producto.descripcion}"></p>

            <p class="mt-3">
                <strong>Stock disponible:</strong>
                <span th:text="${producto.stock}"></span>
            </p>

            <div class="mt-4 d-flex gap-2">
                <a class="btn btn-dino-primary"
                   th:href="@{'/carrito/add/' + ${producto.id}}">
                    Añadir al carrito
                </a>

                <a class="btn btn-secondary"
                   th:href="@{/tienda}">
                    Volver a la tienda
                </a>
            </div>
        </div>
    </div>

</div>

</body>
</html>
