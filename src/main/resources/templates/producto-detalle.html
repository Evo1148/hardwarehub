<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::contenido})">

<div th:fragment="contenido">

    <div class="row">
        <div class="col-md-5 text-center">
            <img th:if="${producto.imagen != null}" th:src="${producto.imagen}"
                 th:alt="${producto.nombre}"
                 class="img-fluid mb-4 border"
                 style="max-height: 320px; object-fit: contain;">
        </div>

        <div class="col-md-7">
            <h1 class="h3 page-title" th:text="${producto.nombre}">Nombre</h1>

            <p class="subtitle mb-2">
                <strong>Categoría:</strong>
                <span th:text="${producto.categoria != null ? producto.categoria.nombre : 'Sin categoría'}"></span>
            </p>

            <p class="subtitle mb-2">
                <strong>Vendedor:</strong>
                <span th:text="${producto.vendedor != null ? producto.vendedor.nombre : 'Sin vendedor'}"></span>
            </p>

            <h3 class="text-success mb-3">
                <span th:text="${producto.precio}"></span> €
            </h3>

            <p th:text="${producto.descripcion}"></p>

            <p class="mt-3">
                <strong>Stock disponible:</strong>
                <span th:text="${producto.stock}"></span>
            </p>

            <div class="mt-4 d-flex gap-2">
                <form th:if="${isLoggedIn and producto.stock > 0}"
                      th:action="@{'/carrito/add/' + ${producto.id}}" method="post" class="m-0">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-dino-primary">Añadir al carrito</button>
                </form>

                <a class="btn btn-dino-primary"
                   th:if="${!isLoggedIn}"
                   th:href="@{/login}">
                    Iniciar sesión para comprar
                </a>

                <button class="btn btn-secondary" th:if="${isLoggedIn and producto.stock <= 0}" disabled>
                    Producto agotado
                </button>

                <a class="btn btn-secondary"
                   th:href="@{/tienda}">
                    Volver al marketplace
                </a>
            </div>
        </div>
    </div>

</div>

</html>
