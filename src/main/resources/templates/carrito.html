<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::contenido})">

<div th:fragment="contenido">

    <h1 class="h3 mb-3">Carrito de Compras</h1>

    <div th:if="${mensaje != null and !#strings.isEmpty(mensaje)}" class="alert alert-warning" th:text="${mensaje}"></div>

    <div th:if="${#lists.isEmpty(items)}" class="alert alert-info">
        Tu carrito está vacío.
    </div>

    <table class="table table-striped" th:if="${!#lists.isEmpty(items)}">
        <thead class="table-dark">
        <tr>
            <th>Producto</th>
            <th>Vendedor</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${items}">
            <td th:text="${i.producto.nombre}"></td>
            <td th:text="${i.producto.vendedor != null ? i.producto.vendedor.nombre : 'Sin vendedor'}"></td>
            <td th:text="${i.producto.precio}"></td>

            <td>
                <form th:action="@{'/carrito/update/' + ${i.producto.id}}" method="post" class="d-flex align-items-center">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <label th:for="${'cantidad-' + i.producto.id}" class="visually-hidden">Cantidad</label>
                    <input th:id="${'cantidad-' + i.producto.id}" type="number" class="form-control me-2"
                           style="width: 80px;" th:value="${i.cantidad}" name="cantidad" min="0"
                           th:max="${i.producto.stock}"
                           th:attr="aria-label=${'Cantidad de ' + i.producto.nombre}">
                    <button class="btn btn-primary btn-sm" type="submit">Actualizar</button>
                </form>
                <small class="text-muted">Stock: <span th:text="${i.producto.stock}"></span></small>
            </td>

            <td th:text="${i.subtotal}"></td>

            <td>
                <form th:action="@{'/carrito/remove/' + ${i.producto.id}}" method="post" class="m-0">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-danger btn-sm">Quitar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="text-end" th:if="${!#lists.isEmpty(items)}">
        <h3>Total: <span th:text="${total}"></span> €</h3>
        <form th:action="@{/carrito/finalizar}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-success mt-2" type="submit"
                    onclick="return confirm('¿Confirmar la compra? Se descontará el stock de los productos.');">
                Finalizar compra
            </button>
        </form>
    </div>

</div>

</html>
