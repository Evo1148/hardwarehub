<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carrito</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/tienda}">HardwareHub</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/tienda}">Tienda</a>
            <a class="nav-link active" th:href="@{/carrito}">Carrito</a>

        </div>
    </div>
</nav>

<div class="container">

    <h1 class="h3 mb-3">Carrito de Compras</h1>

    <div th:if="${#lists.isEmpty(items)}" class="alert alert-info">
        Tu carrito está vacío.
    </div>

    <table class="table table-striped" th:if="${!#lists.isEmpty(items)}">
        <thead class="table-dark">
        <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${items}">
            <td th:text="${i.producto.nombre}"></td>
            <td th:text="${i.producto.precio}"></td>

            <td>
                <form th:action="@{'/carrito/update/' + ${i.producto.id}}" method="post" class="d-flex">
                    <input type="number" class="form-control me-2" style="width: 70px;"
                           th:value="${i.cantidad}" name="cantidad" min="0">
                    <button class="btn btn-primary btn-sm" type="submit">Actualizar</button>
                </form>
            </td>

            <td th:text="${i.subtotal}"></td>

            <td>
                <a th:href="@{'/carrito/remove/' + ${i.producto.id}}" class="btn btn-danger btn-sm">
                    Quitar
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="text-end" th:if="${!#lists.isEmpty(items)}">
        <h3>Total: <span th:text="${total}"></span> €</h3>
        <button class="btn btn-success mt-2">Finalizar Compra (ficticio)</button>
    </div>

</div>

</body>
</html>
