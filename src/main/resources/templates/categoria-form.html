<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::contenido})">

<div th:fragment="contenido">

    <h1 class="h3 mb-3"
        th:text="${categoria.id == null ? 'Nueva categoría' : 'Editar categoría'}">
        Formulario categoría
    </h1>

    <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input id="nombre" type="text" class="form-control" th:field="*{nombre}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}"
                 th:errors="*{nombre}">Error nombre</div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="descripcion">Descripción</label>
            <textarea id="descripcion" class="form-control" th:field="*{descripcion}"
                      rows="3"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('descripcion')}"
                 th:errors="*{descripcion}">Error descripcion</div>
        </div>

        <div class="d-flex justify-content-between">
            <a class="btn btn-secondary" th:href="@{/categorias}">Volver</a>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </div>

    </form>
</div>

</html>
