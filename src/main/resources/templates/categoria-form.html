<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${#strings.isEmpty(categoria.id) ? 'Nueva categoría' : 'Editar categoría'}">
        Formulario categoría
    </title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">HardwareHub</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/tienda}">Tienda</a>
            <a class="nav-link" th:href="@{/carrito}">Carrito</a>
            <a class="nav-link" th:href="@{/productos}">Admin Productos</a>
            <a class="nav-link" th:href="@{/categorias}">Admin Categorías</a>
        </div>
    </div>
</nav>


<div class="container">
    <h1 class="h3 mb-3"
        th:text="${#strings.isEmpty(categoria.id) ? 'Nueva categoría' : 'Editar categoría'}">
        Formulario categoría
    </h1>

    <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input id="nombre" type="text" class="form-control" th:field="*{nombre}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}"
                 th:errors="*{nombre}">Error nombre</div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="descripcion">Descripción</label>
            <textarea id="descripcion" class="form-control" th:field="*{descripcion}"
                      rows="3"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('descripcion')}"
                 th:errors="*{descripcion}">Error descripcion</div>
        </div>

        <div class="d-flex justify-content-between">
            <a class="btn btn-secondary" th:href="@{/categorias}">Volver</a>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </div>

    </form>
</div>

</body>
</html>
