<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::contenido})">

<div th:fragment="contenido">

    <div th:if="${mensaje != null and !#strings.isEmpty(mensaje)}" class="alert alert-warning" th:text="${mensaje}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3" th:text="${isAdmin ? 'Todos los productos' : 'Mis productos en venta'}">Productos</h1>
            <p class="text-muted mb-0" th:if="${!isAdmin}">Aquí aparecen solo los productos publicados por tu cuenta de vendedor.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/productos/nuevo}">Nuevo Producto</a>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Vendedor</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Imagen</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="producto : ${productos}">
            <td th:text="${producto.id}"></td>
            <td th:text="${producto.nombre}"></td>
            <td th:text="${producto.vendedor != null ? producto.vendedor.nombre : 'Sin vendedor'}"></td>
            <td th:text="${producto.categoria != null ? producto.categoria.nombre : 'Sin categoría'}"></td>
            <td th:text="${producto.precio}"></td>
            <td th:text="${producto.stock}"></td>

            <td>
                <img th:if="${producto.imagen != null}"
                     th:src="${producto.imagen}"
                     th:alt="${producto.nombre}"
                     style="width: 60px; height: auto;"
                     class="img-thumbnail"/>

                <span th:if="${producto.imagen == null}" class="text-muted">Sin imagen</span>
            </td>

            <td class="text-end">
                <a class="btn btn-sm btn-secondary"
                   th:href="@{'/productos/editar/' + ${producto.id}}">Editar</a>
                <form th:action="@{'/productos/eliminar/' + ${producto.id}}" method="post" class="d-inline">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-sm btn-danger ms-2"
                            onclick="return confirm('¿Seguro que deseas eliminar este producto?');">
                        Eliminar
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(productos)}" class="alert alert-info">
        No hay productos todavía. Crea el primero.
    </div>

</div>

</html>
