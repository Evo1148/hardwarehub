<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Producto</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">HardwareHub</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/tienda}">Tienda</a>
            <a class="nav-link" th:href="@{/carrito}">Carrito</a>
            <a class="nav-link" th:href="@{/productos}">Admin Productos</a>
            <a class="nav-link" th:href="@{/categorias}">Admin Categorías</a>
        </div>
    </div>
</nav>


<div class="container mt-4">

    <h1 class="h3 mb-3" th:text="${producto.id == null} ? 'Nuevo Producto' : 'Editar Producto'"></h1>

    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input class="form-control" th:field="*{nombre}">
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" class="form-control" th:field="*{precio}"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Stock</label>
            <input type="number" class="form-control" th:field="*{stock}"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select class="form-select" th:field="*{categoria}">
                <option th:each="c : ${categorias}"
                        th:value="${c.id}"
                        th:text="${c.nombre}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">URL Imagen</label>
            <input class="form-control" th:field="*{imagen}" placeholder="https://...">
        </div>

        <div class="d-flex justify-content-between">
            <a class="btn btn-secondary" th:href="@{/productos}">Volver</a>
            <button class="btn btn-primary" type="submit">Guardar</button>
        </div>

    </form>

</div>

</body>
</html>
