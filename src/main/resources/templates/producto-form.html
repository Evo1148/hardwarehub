<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::contenido})">

<div th:fragment="contenido">

    <h1 class="h3 mb-3" th:text="${producto.id == null} ? 'Nuevo Producto' : 'Editar Producto'"></h1>

    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input id="nombre" class="form-control" th:field="*{nombre}">
            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error nombre</div>
        </div>

        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea id="descripcion" class="form-control" th:field="*{descripcion}" rows="3"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}">Error descripcion</div>
        </div>

        <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input id="precio" type="number" step="0.01" class="form-control" th:field="*{precio}"/>
            <div class="text-danger" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}">Error precio</div>
        </div>

        <div class="mb-3">
            <label for="stock" class="form-label">Stock</label>
            <input id="stock" type="number" class="form-control" th:field="*{stock}"/>
            <div class="text-danger" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}">Error stock</div>
        </div>

        <div class="mb-3">
            <label for="categoria" class="form-label">Categoría</label>
            <select id="categoria" class="form-select" th:field="*{categoria}">
                <option value="">Selecciona categoría</option>
                <option th:each="c : ${categorias}"
                        th:value="${c.id}"
                        th:text="${c.nombre}">
                </option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}">Error categoría</div>
        </div>

        <div class="mb-3" th:if="${isAdmin}">
            <label for="vendedor" class="form-label">Vendedor</label>
            <select id="vendedor" class="form-select" th:field="*{vendedor}">
                <option value="">Selecciona vendedor</option>
                <option th:each="v : ${vendedores}"
                        th:value="${v.id}"
                        th:text="${v.nombre + ' - ' + v.email}">
                </option>
            </select>
            <small class="text-muted">Como admin puedes asignar el producto a cualquier vendedor.</small>
        </div>

        <div class="alert alert-info" th:if="${!isAdmin}">
            Este producto quedará publicado con tu cuenta de vendedor:
            <strong th:text="${currentUser.nombre}"></strong>
        </div>

        <div class="mb-3">
            <label for="imagen" class="form-label">URL Imagen</label>
            <input id="imagen" class="form-control" th:field="*{imagen}" placeholder="https://...">
        </div>

        <div class="d-flex justify-content-between">
            <a class="btn btn-secondary" th:href="@{/productos}">Volver</a>
            <button class="btn btn-primary" type="submit">Guardar</button>
        </div>

    </form>

</div>

</html>
