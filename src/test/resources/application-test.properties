# Correccion posterior asistida por IA (OpenAI Codex, 2026-08-08).
# Las pruebas usan una base de datos efimera y no dependen del MySQL local.
spring.datasource.url=jdbc:h2:mem:hardwarehub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never
